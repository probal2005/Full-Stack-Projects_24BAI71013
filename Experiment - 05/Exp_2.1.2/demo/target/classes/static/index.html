<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎓 Student Dashboard Pro</title>
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ---------- গ্লোবাল ---------- */
        * { box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #f0f4ff 0%, #e6edf9 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }
        .dashboard-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 28px;
            box-shadow: 0 30px 60px rgba(0,20,50,0.12);
            animation: slideUp 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes slideUp {
            0% { opacity: 0; transform: translateY(40px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ---------- স্ট্যাট কার্ড ---------- */
        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.04);
            transition: all 0.3s ease;
            border-left: 6px solid #6c5ce7;
            position: relative;
            overflow: hidden;
        }
        .stat-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 40px rgba(108,92,231,0.15);
        }
        .stat-card .stat-icon {
            position: absolute;
            right: 15px;
            top: 15px;
            font-size: 2.8rem;
            opacity: 0.08;
        }
        .stat-number {
            font-size: 2.4rem;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.5px;
        }
        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #6c757d;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .stat-card.green { border-left-color: #00b894; }
        .stat-card.orange { border-left-color: #fdcb6e; }
        .stat-card.pink { border-left-color: #fd79a8; }

        /* ---------- টেবিল ---------- */
        .table-container {
            background: white;
            border-radius: 20px;
            padding: 10px 0;
            margin-top: 20px;
        }
        .table th {
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #2d3436;
            border-bottom: 2px solid #dfe6e9;
            padding: 14px 12px;
            background: #fafbfc;
        }
        .table td {
            padding: 14px 12px;
            vertical-align: middle;
            border-bottom: 1px solid #f1f2f6;
        }
        .table tbody tr {
            transition: all 0.2s;
            animation: fadeRow 0.4s ease forwards;
            opacity: 0;
        }
        @keyframes fadeRow {
            to { opacity: 1; }
        }
        .table tbody tr:hover {
            background: #f8f9ff;
            transform: scale(1.003);
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            background: #6c5ce7;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .badge-dept {
            background: #e8f0fe;
            color: #2d3e7a;
            border-radius: 30px;
            padding: 5px 16px;
            font-weight: 500;
            font-size: 0.8rem;
        }
        .btn-action {
            border-radius: 30px;
            padding: 4px 14px;
            font-size: 0.8rem;
            margin: 0 3px;
            transition: all 0.2s;
        }
        .btn-edit {
            background: #ffd93d;
            color: #2d3436;
            border: none;
        }
        .btn-edit:hover { background: #f9ca24; transform: scale(1.05); }
        .btn-delete {
            background: #ff6b6b;
            color: white;
            border: none;
        }
        .btn-delete:hover { background: #ee5a24; transform: scale(1.05); }

        /* ---------- সার্চ ও ফিল্টার ---------- */
        .search-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }
        .search-wrapper .form-control {
            border-radius: 40px;
            padding: 12px 22px;
            border: 2px solid #dfe6e9;
            transition: 0.3s;
            background: white;
        }
        .search-wrapper .form-control:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 4px rgba(108,92,231,0.12);
        }
        .filter-select {
            border-radius: 40px;
            padding: 12px 22px;
            border: 2px solid #dfe6e9;
            background: white;
            min-width: 160px;
        }

        /* ---------- পেজিনেশন ---------- */
        .pagination .page-link {
            border: none;
            border-radius: 30px;
            margin: 0 4px;
            color: #2d3436;
            font-weight: 500;
            padding: 8px 16px;
            transition: 0.3s;
        }
        .pagination .page-link:hover {
            background: #6c5ce7;
            color: white;
        }
        .pagination .active .page-link {
            background: #6c5ce7;
            color: white;
        }

        /* ---------- টোস্ট ---------- */
        .toast-container {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 9999;
        }
        .toast-custom {
            background: #1a1a2e;
            color: white;
            padding: 14px 24px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.25);
            border-left: 6px solid #00b894;
            margin-bottom: 12px;
            transform: translateX(120%);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            min-width: 260px;
            font-weight: 500;
        }
        .toast-custom.show { transform: translateX(0); }
        .toast-custom.error { border-left-color: #ff6b6b; }

        /* ---------- মোডাল ---------- */
        .modal-content {
            border-radius: 24px;
            border: none;
        }
        .modal-header {
            border-bottom: none;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            border-radius: 24px 24px 0 0;
            padding: 20px 28px;
        }
        .modal-header .btn-close { filter: brightness(0) invert(1); }
        .modal-footer { border-top: none; }

        /* ---------- রেসপন্সিভ ---------- */
        @media (max-width: 576px) {
            .dashboard-card { padding: 16px; }
            .stat-number { font-size: 1.8rem; }
            .search-wrapper { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <div class="dashboard-card">

            <!-- হেডার -->
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                <h1 class="h3 mb-0"><i class="fas fa-graduation-cap text-primary me-2"></i>Student Dashboard</h1>
                <div>
                    <button class="btn btn-outline-secondary me-2" onclick="loadStudents()" title="Refresh">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="fas fa-plus-circle"></i> Add Student
                    </button>
                </div>
            </div>

            <!-- স্ট্যাটিস্টিক্স রো -->
            <div class="row g-3 mb-4">
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-users"></i></div>
                        <div class="stat-number" id="totalStudents">0</div>
                        <div class="stat-label">Total Students</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card green">
                        <div class="stat-icon"><i class="fas fa-building"></i></div>
                        <div class="stat-number" id="deptCount">0</div>
                        <div class="stat-label">Departments</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card orange">
                        <div class="stat-icon"><i class="fas fa-user-plus"></i></div>
                        <div class="stat-number" id="todayCount">0</div>
                        <div class="stat-label">Added Today</div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card pink">
                        <div class="stat-icon"><i class="fas fa-envelope"></i></div>
                        <div class="stat-number" id="emailCount">0</div>
                        <div class="stat-label">Unique Emails</div>
                    </div>
                </div>
            </div>

            <!-- সার্চ + ফিল্টার + এক্সপোর্ট -->
            <div class="search-wrapper">
                <div class="flex-grow-1">
                    <input type="text" id="searchInput" class="form-control" placeholder="🔍 Search by name, email or department..." onkeyup="applyFilters()" />
                </div>
                <select id="deptFilter" class="filter-select" onchange="applyFilters()">
                    <option value="">All Departments</option>
                </select>
                <button class="btn btn-success" onclick="exportCSV()"><i class="fas fa-file-csv"></i> Export CSV</button>
            </div>

            <!-- টেবিল -->
            <div class="table-container">
                <div class="table-responsive">
                    <table class="table mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <!-- ডাইনামিক -->
                        </tbody>
                    </table>
                </div>
                <!-- পেজিনেশন -->
                <div class="d-flex justify-content-between align-items-center p-3">
                    <span id="paginationInfo" class="text-muted small"></span>
                    <nav>
                        <ul class="pagination mb-0" id="paginationControls">
                            <!-- JS দিয়ে তৈরি হবে -->
                        </ul>
                    </nav>
                </div>
                <div id="emptyState" class="text-center py-5" style="display:none;">
                    <i class="fas fa-user-graduate fa-4x text-muted opacity-25"></i>
                    <p class="mt-3 text-muted">No students found. Add your first student!</p>
                </div>
            </div>

        </div>
    </div>

    <!-- 📌 ADD MODAL -->
    <div class="modal fade" id="addModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-plus me-2"></i>Add Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="addName" placeholder="e.g. Probal Dhali" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="addEmail" placeholder="probaldhali2006@gmail.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" id="addDept" placeholder="e.g. CSE" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createStudent()"><i class="fas fa-save"></i> Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 📌 EDIT MODAL -->
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-user-edit me-2"></i>Edit Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId" />
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="editName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="editEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control" id="editDept" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="updateStudent()"><i class="fas fa-save"></i> Update</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const API_BASE = 'http://localhost:8080/api/students';
        let allStudents = [];
        let currentPage = 1;
        const pageSize = 5;

        // ---------- টোস্ট ----------
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast-custom ${type}`;
            t.innerHTML = `<i class="fas ${type==='success'?'fa-check-circle':'fa-exclamation-circle'} me-2"></i> ${message}`;
            container.appendChild(t);
            setTimeout(() => t.classList.add('show'), 30);
            setTimeout(() => {
                t.classList.remove('show');
                setTimeout(() => t.remove(), 500);
            }, 3500);
        }

        // ---------- লোড ডেটা ----------
        async function loadStudents() {
            try {
                const res = await fetch(API_BASE);
                const json = await res.json();
                if (json.success) {
                    allStudents = json.data || [];
                    updateStats();
                    populateDeptFilter();
                    applyFilters();
                } else {
                    showToast('Failed to load', 'error');
                }
            } catch (e) {
                showToast('Network error: ' + e.message, 'error');
            }
        }

        // ---------- স্ট্যাট আপডেট ----------
        function updateStats() {
            document.getElementById('totalStudents').textContent = allStudents.length;
            const depts = new Set(allStudents.map(s => s.department));
            document.getElementById('deptCount').textContent = depts.size;
            document.getElementById('todayCount').textContent = allStudents.length; // সিমুলেট
            document.getElementById('emailCount').textContent = new Set(allStudents.map(s => s.email)).size;
        }

        // ---------- ডিপার্টমেন্ট ফিল্টার পপুলেট ----------
        function populateDeptFilter() {
            const depts = new Set(allStudents.map(s => s.department));
            const sel = document.getElementById('deptFilter');
            const current = sel.value;
            sel.innerHTML = '<option value="">All Departments</option>';
            depts.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                if (d === current) opt.selected = true;
                sel.appendChild(opt);
            });
        }

        // ---------- ফিল্টার + পেজিনেশন ----------
        function applyFilters() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const dept = document.getElementById('deptFilter').value;
            let filtered = allStudents.filter(s => {
                const matchName = s.name.toLowerCase().includes(keyword);
                const matchEmail = s.email.toLowerCase().includes(keyword);
                const matchDept = s.department.toLowerCase().includes(keyword);
                const matchDeptFilter = dept === '' || s.department === dept;
                return (matchName || matchEmail || matchDept) && matchDeptFilter;
            });
            renderTable(filtered);
            renderPagination(filtered.length);
        }

        // ---------- টেবিল রেন্ডার ----------
        function renderTable(data) {
            const tbody = document.getElementById('studentTableBody');
            const empty = document.getElementById('emptyState');
            const start = (currentPage - 1) * pageSize;
            const pageData = data.slice(start, start + pageSize);

            if (pageData.length === 0) {
                tbody.innerHTML = '';
                empty.style.display = 'block';
                document.getElementById('paginationInfo').textContent = '';
                return;
            }
            empty.style.display = 'none';

            const colors = ['#6c5ce7', '#00b894', '#fdcb6e', '#fd79a8', '#0984e3', '#e17055'];
            tbody.innerHTML = pageData.map((s, idx) => {
                const color = colors[idx % colors.length];
                const initial = s.name.charAt(0).toUpperCase();
                return `
                <tr style="animation-delay: ${idx * 0.04}s">
                    <td>${start + idx + 1}</td>
                    <td>
                        <div class="d-flex align-items-center">
                            <span class="avatar" style="background:${color}">${initial}</span>
                            <span>${s.name}</span>
                        </div>
                    </td>
                    <td><a href="mailto:${s.email}" class="text-decoration-none">${s.email}</a></td>
                    <td><span class="badge-dept">${s.department}</span></td>
                    <td class="text-end">
                        <button class="btn btn-action btn-edit" onclick="openEditModal(${s.id})"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-action btn-delete" onclick="deleteStudent(${s.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `}).join('');
            document.getElementById('paginationInfo').textContent = `Showing ${start+1}–${Math.min(start+pageSize, data.length)} of ${data.length}`;
        }

        // ---------- পেজিনেশন কন্ট্রোল ----------
        function renderPagination(total) {
            const totalPages = Math.ceil(total / pageSize) || 1;
            const ul = document.getElementById('paginationControls');
            let html = '';
            for (let i = 1; i <= totalPages; i++) {
                html += `<li class="page-item ${i===currentPage?'active':''}"><a class="page-link" href="#" onclick="goToPage(${i}); return false;">${i}</a></li>`;
            }
            ul.innerHTML = html;
        }

        function goToPage(page) {
            currentPage = page;
            applyFilters();
        }

        // ---------- ক্রিয়েট ----------
        async function createStudent() {
            const name = document.getElementById('addName').value.trim();
            const email = document.getElementById('addEmail').value.trim();
            const department = document.getElementById('addDept').value.trim();
            if (!name || !email || !department) {
                showToast('All fields required!', 'error');
                return;
            }
            try {
                const res = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, department })
                });
                const json = await res.json();
                if (json.success) {
                    showToast(json.message);
                    bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
                    document.getElementById('addName').value = '';
                    document.getElementById('addEmail').value = '';
                    document.getElementById('addDept').value = '';
                    loadStudents();
                } else {
                    showToast(json.message || 'Creation failed', 'error');
                }
            } catch (e) {
                showToast('Network error', 'error');
            }
        }

        // ---------- এডিট ----------
        async function openEditModal(id) {
            try {
                const res = await fetch(`${API_BASE}/${id}`);
                const json = await res.json();
                if (json.success) {
                    const s = json.data;
                    document.getElementById('editId').value = s.id;
                    document.getElementById('editName').value = s.name;
                    document.getElementById('editEmail').value = s.email;
                    document.getElementById('editDept').value = s.department;
                    new bootstrap.Modal(document.getElementById('editModal')).show();
                } else {
                    showToast('Failed to fetch details', 'error');
                }
            } catch (e) {
                showToast('Network error', 'error');
            }
        }

        async function updateStudent() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('editName').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const department = document.getElementById('editDept').value.trim();
            if (!name || !email || !department) {
                showToast('All fields required!', 'error');
                return;
            }
            try {
                const res = await fetch(`${API_BASE}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, department })
                });
                const json = await res.json();
                if (json.success) {
                    showToast(json.message);
                    bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
                    loadStudents();
                } else {
                    showToast(json.message || 'Update failed', 'error');
                }
            } catch (e) {
                showToast('Network error', 'error');
            }
        }

        // ---------- ডিলিট ----------
        async function deleteStudent(id) {
            if (!confirm('Delete this student?')) return;
            try {
                const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
                const json = await res.json();
                if (json.success) {
                    showToast(json.message);
                    loadStudents();
                } else {
                    showToast(json.message || 'Deletion failed', 'error');
                }
            } catch (e) {
                showToast('Network error', 'error');
            }
        }

        // ---------- এক্সপোর্ট CSV ----------
        function exportCSV() {
            if (allStudents.length === 0) {
                showToast('No data to export', 'error');
                return;
            }
            let csv = 'Name,Email,Department\n';
            allStudents.forEach(s => {
                csv += `"${s.name}","${s.email}","${s.department}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `students_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('CSV exported successfully!');
        }

        // ---------- ইনিশিয়াল ----------
        loadStudents();
    </script>
</body>
</html>
