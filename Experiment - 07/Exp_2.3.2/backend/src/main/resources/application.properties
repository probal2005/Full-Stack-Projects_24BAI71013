spring.application.name=experiment-2.3.2

server.port=8081

spring.datasource.url=jdbc:h2:file:./data/security232db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AES-256 key is supplied through the environment.
# Generate it once and keep it outside source control.
security.aes-key=${AES_SECRET_KEY}

# JWT signing secret for the lab.
security.jwt-secret=${JWT_SECRET:Experiment232JwtSigningSecretKeyForSpringBoot2026Security}
security.access-token-expiration-ms=900000

spring.jackson.serialization.write-dates-as-timestamps=false

server.error.include-message=always
