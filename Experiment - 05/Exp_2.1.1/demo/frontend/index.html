<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Post Manager - Experiment 2.1.1</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .post-item { border: 1px solid #ccc; padding: 10px; margin: 5px 0; }
        input, textarea { width: 300px; padding: 8px; margin: 5px 0; display: block; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>📝 All Posts</h2>
    <div id="postsList"></div>

    <hr>
    <h3>➕ Create New Post</h3>
    <input id="titleInput" placeholder="Title (min 3 chars)">
    <textarea id="contentInput" placeholder="Content (min 10 chars)"></textarea>
    <button onclick="createPost()">Submit</button>

    <script>
        const API_BASE = 'http://localhost:8080/api/posts';

        // Load all posts
        async function loadPosts() {
            try {
                const res = await fetch(API_BASE);
                const json = await res.json();
                const container = document.getElementById('postsList');
                if (json.success && json.data.length > 0) {
                    container.innerHTML = json.data.map(p => `
                        <div class="post-item">
                            <strong>${p.title}</strong> 
                            <p>${p.content}</p>
                            <button onclick="deletePost(${p.id})">🗑️ Delete</button>
                            <hr>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p>No posts found.</p>';
                }
            } catch (error) {
                alert('Error loading posts: ' + error.message);
            }
        }

        // Create a new post
        async function createPost() {
            const title = document.getElementById('titleInput').value;
            const content = document.getElementById('contentInput').value;

            try {
                const res = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, content })
                });
                const json = await res.json();
                if (json.success) {
                    alert('✅ ' + json.message);
                    document.getElementById('titleInput').value = '';
                    document.getElementById('contentInput').value = '';
                    loadPosts(); // রিফ্রেশ
                } else {
                    alert('❌ Error: ' + json.message + '\n' + JSON.stringify(json.data));
                }
            } catch (error) {
                alert('Network Error: ' + error.message);
            }
        }

        // Delete a post
        async function deletePost(id) {
            if (!confirm('Are you sure you want to delete this post?')) return;
            try {
                const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
                const json = await res.json();
                if (json.success) {
                    alert('✅ ' + json.message);
                    loadPosts();
                } else {
                    alert('❌ ' + json.message);
                }
            } catch (error) {
                alert('Network Error: ' + error.message);
            }
        }

        // Initial load
        loadPosts();
    </script>
</body>
</html>
